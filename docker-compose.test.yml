name: hivenode-test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hivenode_test
      POSTGRES_USER: hivenode_test
      POSTGRES_PASSWORD: local-test-only
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hivenode_test -d hivenode_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
