name: hivenode
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hivenode
      POSTGRES_USER: hivenode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hivenode -d hivenode"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", --appendonly, "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: { context: ./web, target: tools }
    environment: &web-env
      DATABASE_URL: postgresql://hivenode:${POSTGRES_PASSWORD}@postgres:5432/hivenode
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      BROKER_INTERNAL_SECRET: ${BROKER_INTERNAL_SECRET:?Set BROKER_INTERNAL_SECRET}
      BROKER_API_URL: http://broker:10001
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_BROKER_URL: ${BROKER_URL:-ws://localhost:10001}
      NEXT_PUBLIC_SOCKS_HOST: ${SOCKS_HOST:-localhost}
      BROKER_SOCKS_PORT: ${SOCKS_PORT:-10000}
      APP_ENV: ${APP_ENV:-local}
      ABACATE_PAY_API_KEY: ${ABACATE_PAY_API_KEY:-}
      ABACATE_PAY_WEBHOOK_SECRET: ${ABACATE_PAY_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    command: [npx, prisma, migrate, deploy]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: { context: ./web, target: runner }
    environment: *web-env
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
  worker:
    build: { context: ./web, target: tools }
    environment: *web-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  broker:
    build: { context: ./broker, target: runner }
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BROKER_INTERNAL_SECRET: ${BROKER_INTERNAL_SECRET}
      WEB_API_URL: http://web:3000
      WEB_ORIGIN: ${APP_URL:-http://localhost:3000}
      SOCKS5_PORT: 10000
      TUNNEL_PORT: 10001
      APP_ENV: ${APP_ENV:-local}
    ports:
      - "${SOCKS_BIND:-127.0.0.1}:${SOCKS_PORT:-10000}:10000"
      - "${BROKER_BIND:-127.0.0.1}:${BROKER_PORT:-10001}:10001"
    depends_on:
      web: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
